name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (src/ and tests/)
        run: |
          # Fail only on real errors (syntax errors, undefined names, etc.);
          # keep style nits (E/W) as warnings so this doesn't block on
          # formatting alone. Tune this once the codebase has a style guide.
          flake8 src tests scripts --select=E9,F63,F7,F82 --show-source
          flake8 src tests scripts --exit-zero --max-line-length=100

      - name: Run tests
        run: |
          pytest tests/ scripts/ -v
